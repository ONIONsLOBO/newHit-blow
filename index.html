<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒット&ブロー</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#26292c">
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>ヒット&amp;ブロー</h1>
      <label class="mode">モード
        <select id="mode">
          <option value="player" selected>自分が当てる</option>
          <option value="cpu">CPUが当てる</option>
          <option value="versus">交互に対戦</option>
        </select>
      </label>
      <label class="mode">ボールの数
        <select id="slots">
          <option value="4" selected>4個</option>
          <option value="5">5個</option>
          <option value="6">6個</option>
          <option value="7">7個</option>
          <option value="8">8個</option>
          <option value="9">9個</option>
          <option value="10">10個</option>
        </select>
      </label>
      <label class="mode">制限時間
        <select id="limit">
          <option value="0" selected>なし</option>
          <option value="1">1分</option>
          <option value="2">2分</option>
          <option value="3">3分</option>
          <option value="4">4分</option>
          <option value="5">5分</option>
          <option value="6">6分</option>
          <option value="7">7分</option>
          <option value="8">8分</option>
          <option value="9">9分</option>
          <option value="10">10分</option>
        </select>
      </label>
    </header>

    <p class="legend">
      <span><i class="peg hit"></i>ヒット:色と場所が正解</span>
      <span><i class="peg blow"></i>ブロー:色だけ正解</span>
    </p>

    <details class="rules">
      <summary>ルール</summary>
      <p>答えは、同じ色を重ねずに並べたボールです(6個までは6色、7個以上はボールの数と同じ色数)。予想では同じ色を何回使ってもOKです。下の色をえらぶと、光っている列の上から順にボールが入ります。入れたボールをクリックすると外せます。10回以内に当てましょう。<br>「CPUが当てる」では、自分で答えを決めてCPUに当ててもらいます(ボールは8個まで)。「交互に対戦」では、あなたとCPUが1回ずつ交代で相手の答えを予想し、先に当てた方の勝ちです(あなたが先攻)。</p>
    </details>

    <p id="timer" class="timer" role="timer" hidden></p>

    <section class="boardwrap">
      <h2 id="mainTitle"></h2>
      <div class="board" id="mainBoard"></div>
    </section>

    <div class="control" id="play">
      <p id="playTitle"></p>
      <div class="palette" id="palette"></div>
      <div class="actions">
        <button type="button" id="clear">クリア</button>
        <button type="button" id="submit" class="primary" disabled>これで決定</button>
      </div>
    </div>

    <section class="boardwrap" id="cpuWrap" hidden>
      <h2>CPUの盤:あなたの答えをCPUが当てる</h2>
      <div class="board" id="cpuBoard"></div>
    </section>

    <p id="message" class="message"></p>
    <button type="button" id="restart" class="primary" hidden>もう一度あそぶ</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
